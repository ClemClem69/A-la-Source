<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <clipPath id="rounded">
      <rect width="64" height="64" rx="14" ry="14"/>
    </clipPath>
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000" flood-opacity="0.05"/>
    </filter>
    <filter id="leafShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="0.5" flood-color="#000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Drapeau français vertical (identique à .french-flag) -->
  <g clip-path="url(#rounded)">
    <rect width="21.333" height="64" fill="#1d4ed8"/>
    <rect x="21.333" width="21.334" height="64" fill="#ffffff"/>
    <rect x="42.667" width="21.333" height="64" fill="#dc2626"/>
  </g>

  <!-- Bordure arrondie -->
  <rect width="64" height="64" rx="14" ry="14" fill="none" stroke="#e7e5e4" stroke-width="1" filter="url(#boxShadow)"/>

  <!-- Feuille Lucide (identique au Header) -->
  <g transform="translate(32, 32) scale(1.481) translate(-12, -12)" filter="url(#leafShadow)">
    <path
      d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"
      fill="none"
      stroke="#0f2d0f"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
    <path
      d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"
      fill="none"
      stroke="#0f2d0f"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    />
  </g>
</svg>
